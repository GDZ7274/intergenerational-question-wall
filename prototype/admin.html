<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'"
    />
    <meta name="description" content="问问墙内容审核与运营管理后台。" />
    <title>内容审核 · 问问墙</title>
    <link rel="preload" href="assets/note-wall-background.jpg" as="image" />
    <link rel="stylesheet" href="admin.css?v=2" />
    <script defer src="config.js?v=2"></script>
    <script defer src="admin.js?v=2"></script>
  </head>
  <body>
    <a class="skip-link" href="#admin-main">跳到主要内容</a>
    <div class="admin-background" aria-hidden="true"></div>
    <div class="admin-frost" aria-hidden="true"></div>

    <main id="admin-main" class="admin-main">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <div class="brand-mark" aria-label="问问墙">
          <span class="brand-bars" aria-hidden="true"><i></i><i></i></span>
          <strong>问问墙</strong>
        </div>
        <p class="login-kicker">内容审核与运营管理</p>
        <h1 id="login-title">管理员登录</h1>
        <p class="login-copy">输入已加入管理员白名单的邮箱，我们会发送一次性登录链接。</p>

        <form id="login-form" class="login-form">
          <label for="admin-email">管理员邮箱</label>
          <input
            id="admin-email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="name@example.com"
            required
          />
          <button class="button button-primary" type="submit">发送登录链接</button>
        </form>
        <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
        <a class="back-link" href="index.html">返回问问墙</a>
      </section>

      <section id="dashboard-view" class="dashboard-view" hidden>
        <header class="admin-header">
          <div class="admin-header-brand">
            <div class="brand-mark" aria-label="问问墙">
              <span class="brand-bars" aria-hidden="true"><i></i><i></i></span>
              <strong>问问墙</strong>
            </div>
            <span class="environment-badge">审核后台</span>
          </div>
          <div class="admin-header-actions">
            <span id="admin-identity" class="admin-identity"></span>
            <button id="refresh-button" class="icon-command" type="button" title="刷新审核数据" aria-label="刷新审核数据">刷新</button>
            <button id="logout-button" class="icon-command" type="button">退出</button>
          </div>
        </header>

        <div class="dashboard-shell">
          <section class="summary-band" aria-label="审核概览">
            <div class="summary-heading">
              <p>今日工作台</p>
              <h1>内容审核</h1>
            </div>
            <dl class="summary-grid">
              <div>
                <dt>待审问题</dt>
                <dd id="summary-questions">0</dd>
              </div>
              <div>
                <dt>待审回答</dt>
                <dd id="summary-answers">0</dd>
              </div>
              <div>
                <dt>未处理举报</dt>
                <dd id="summary-reports">0</dd>
              </div>
              <div>
                <dt>公开便签</dt>
                <dd id="summary-published">0</dd>
              </div>
            </dl>
          </section>

          <nav class="queue-tabs" aria-label="管理视图">
            <button class="queue-tab" type="button" data-view="questions" aria-current="page">
              待审问题 <span id="tab-count-questions">0</span>
            </button>
            <button class="queue-tab" type="button" data-view="answers">
              待审回答 <span id="tab-count-answers">0</span>
            </button>
            <button class="queue-tab" type="button" data-view="reports">
              举报 <span id="tab-count-reports">0</span>
            </button>
            <button class="queue-tab" type="button" data-view="content">内容管理</button>
            <button class="queue-tab" type="button" data-view="history">操作记录</button>
          </nav>

          <section class="workspace" aria-labelledby="workspace-title">
            <div class="workspace-toolbar">
              <div>
                <p id="workspace-eyebrow" class="workspace-eyebrow">审核队列</p>
                <h2 id="workspace-title">待审问题</h2>
              </div>
              <div id="workspace-controls" class="workspace-controls">
                <label class="search-field" for="content-search">
                  <span>搜索</span>
                  <input id="content-search" type="search" placeholder="搜索问题或回答" />
                </label>
                <label id="content-type-field" class="select-field" for="content-type" hidden>
                  <span>类型</span>
                  <select id="content-type">
                    <option value="questions">问题</option>
                    <option value="answers">回答</option>
                  </select>
                </label>
                <label id="content-status-field" class="select-field" for="content-status" hidden>
                  <span>状态</span>
                  <select id="content-status">
                    <option value="">全部状态</option>
                    <option value="pending">待审核</option>
                    <option value="open">开放</option>
                    <option value="closed">已关闭</option>
                    <option value="hidden">已隐藏</option>
                    <option value="rejected">已驳回</option>
                  </select>
                </label>
              </div>
            </div>

            <div id="workspace-loading" class="workspace-state" role="status">正在读取审核数据…</div>
            <div id="workspace-empty" class="workspace-state" hidden>
              <strong>当前队列已处理完</strong>
              <span>新的投稿或举报会自动出现在这里。</span>
            </div>
            <div id="workspace-error" class="workspace-state workspace-error" role="alert" hidden></div>
            <div id="content-list" class="review-list" aria-live="polite"></div>
            <button id="load-more-button" class="load-more-button" type="button" hidden>加载更多</button>
          </section>
        </div>
      </section>
    </main>

    <dialog id="reason-dialog" class="reason-dialog" aria-labelledby="reason-title">
      <form id="reason-form" method="dialog">
        <div class="dialog-heading">
          <p id="reason-eyebrow">审核操作</p>
          <h2 id="reason-title">填写处理说明</h2>
        </div>
        <label for="reason-input">说明</label>
        <textarea id="reason-input" name="reason" maxlength="500" rows="4" placeholder="可选，填写后会记录在操作日志中"></textarea>
        <div class="dialog-actions">
          <button class="button button-secondary" type="button" data-dialog-cancel>取消</button>
          <button id="reason-confirm" class="button button-primary" type="submit">确认处理</button>
        </div>
      </form>
    </dialog>

    <div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>
  </body>
</html>
