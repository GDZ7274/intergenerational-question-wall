name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static application
        shell: bash
        run: |
          node --check prototype/app.js
          node --check prototype/backend.js
          node --check prototype/admin.js
          node --test tests/*.test.mjs
          test -f prototype/admin.html
          test -f prototype/admin.css
          test -f prototype/assets/note-wall-background.jpg
          test -f prototype/assets/wall-scene.png
          test -f prototype/assets/hero-overlay.png
          test -f prototype/assets/landing-duck.png
          test -f prototype/vendor/lucide.min.js
          test -f supabase/migrations/0003_operational_controls.sql
          test -f supabase/migrations/0004_release_hardening.sql

      - name: Prepare site and runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const supabaseUrl = (process.env.SUPABASE_URL || "").trim().replace(/\/$/, "");
          const supabaseAnonKey = (process.env.SUPABASE_ANON_KEY || "").trim();
          if (!supabaseUrl || !supabaseAnonKey) {
            throw new Error("Set SUPABASE_URL and SUPABASE_ANON_KEY in the repository Actions variables before deploying.");
          }

          const parsedUrl = new URL(supabaseUrl);
          if (parsedUrl.protocol !== "https:" || !parsedUrl.hostname.endsWith(".supabase.co")) {
            throw new Error("SUPABASE_URL must be an HTTPS hosted Supabase project URL.");
          }

          fs.rmSync("_site", { recursive: true, force: true });
          fs.cpSync("prototype", "_site", { recursive: true });
          fs.writeFileSync(
            "_site/config.js",
            `window.QUESTION_WALL_CONFIG = Object.freeze(${JSON.stringify(
              {
                supabaseUrl,
                supabaseAnonKey,
                experienceMode: false,
              },
              null,
              2,
            )});\n`,
          );
          NODE

      - name: Verify moderation schema
        shell: bash
        run: |
          MODERATION_STATUS="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Content-Type: application/json" \
              --data '{}' \
              "${SUPABASE_URL}/rest/v1/rpc/moderation_status"
          )"
          export MODERATION_STATUS
          node <<'NODE'
          const status = JSON.parse(process.env.MODERATION_STATUS || "null");
          if (
            status?.schemaVersion !== 3 ||
            status?.hardeningVersion !== 1 ||
            status?.submissionsRequireReview !== true
          ) {
            throw new Error("Supabase moderation/hardening migration is missing or incompatible.");
          }
          NODE

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
